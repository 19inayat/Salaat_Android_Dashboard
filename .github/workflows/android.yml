name: Android APK Build

on:

  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip Project
        run: unzip -o Salaat_Android_Dashboard_FIXED.zip

      - name: Show Extracted Files
        run: ls -R

      - name: Find gradlew
        run: find . -name gradlew

      - name: Grant Permission
        run: chmod +x ./Salaat_Android_Dashboard-main/gradlew

      - name: Build APK
        working-directory: ./Salaat_Android_Dashboard-main
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NamazDashboard-APK
          path: ./Salaat_Android_Dashboard-main/app/build/outputs/apk/debug/app-debug.apk
